name: CI - Documentação e simulação de deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    name: Testes básicos da documentação
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Validar arquivos essenciais
        shell: bash
        run: |
          set -euo pipefail
          arquivos=(
            "README.md"
            "CODE_OF_CONDUCT.md"
            "CONTRIBUTING.md"
            "LICENSE"
            "SECURITY.md"
          )
          for arquivo in "${arquivos[@]}"; do
            if [[ ! -s "$arquivo" ]]; then
              echo "::error::Arquivo ausente ou vazio: $arquivo"
              exit 1
            fi
            echo "OK: $arquivo"
          done

      - name: Executar testes básicos
        run: bash scripts/testes-basicos.sh

      - name: Verificar espaços em branco
        run: git diff --check

  simulacao-deploy:
    name: Simulação de deploy da documentação
    runs-on: ubuntu-latest
    needs: testes
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar pacote para publicação simulada
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy-preview/docs deploy-preview/templates
          cp README.md CODE_OF_CONDUCT.md CONTRIBUTING.md LICENSE SECURITY.md deploy-preview/
          if [[ -d docs ]]; then cp -R docs/. deploy-preview/docs/; fi
          if [[ -d templates ]]; then cp -R templates/. deploy-preview/templates/; fi
          cat > deploy-preview/DEPLOY-SIMULADO.txt <<'EOF'
          Este pacote foi gerado pela pipeline para simular uma publicação.
          Nenhum site foi publicado e nenhum serviço externo foi alterado.
          EOF
          test -s deploy-preview/README.md
          test -s deploy-preview/DEPLOY-SIMULADO.txt
          echo "Pacote de simulação preparado em deploy-preview/"

      - name: Publicar artefato de simulação
        uses: actions/upload-artifact@v4
        with:
          name: simulacao-deploy-documentacao
          path: deploy-preview/
          if-no-files-found: error
          retention-days: 7
